name: Experimental cleanup audit

# Step 01: GitHub Actions trigger, permissions, runtime, and artifact publication.

on:
  # Callout: This manual trigger starts the utility and keeps the MVP operator-controlled.
  workflow_dispatch:
    inputs:
      mode:
        description: Run deterministic profiling or the full Cursor assessment
        required: true
        default: profile
        type: choice
        options:
          - profile
          - assess
      max_assessments:
        description: Maximum candidates sent for assessment
        required: true
        default: "10"
        type: string
      create_tracking_issue:
        description: Create or update the central cleanup-review issue
        required: true
        default: false
        type: boolean
  # Callout: Scheduled polling is an explicit future extension, not an active trigger.
  # schedule:
  #   - cron: "0 15 * * 1"

# Callout: The default token stays read-only. Add `issues: write` before enabling the tracking-issue input.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUDIT_MODE: ${{ inputs.mode }}
      MAX_ASSESSMENTS: ${{ inputs.max_assessments }}
      CREATE_TRACKING_ISSUE: ${{ inputs.create_tracking_issue }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      # Callout: GitHub supplies this token automatically for the current workflow run.
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Callout: This selects the Node.js runtime used by our TypeScript application.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      # Callout: Tests and compilation fail the job before the assessment can run.
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run audit

      # Callout: The evidence package is the output, so the MVP needs no database.
      - name: Upload evidence package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: experimental-cleanup-report
          path: reports/
          if-no-files-found: warn
          retention-days: 7
